apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-reverse-proxy
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/TejPATHAK/project-nginx-reverse-proxy.git
    targetRevision: HEAD
    path: nginx-reverse-proxy

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

